<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07070a"><title>DIV Admin Login</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#07070a}.login{width:min(440px,90vw);padding:34px;border:1px solid #292933;background:#101015;border-radius:24px;box-shadow:0 25px 80px #0008}.login h1{margin:0 0 8px;font-size:42px}.muted{color:#888;font-size:14px}.field{display:flex;flex-direction:column;gap:8px;margin:18px 0}.field label{font-size:11px;color:#aaa;font-weight:700;letter-spacing:.08em}.field input{background:#08080b;color:#fff;border:1px solid #30303a;border-radius:12px;padding:14px;font:inherit;width:100%;box-sizing:border-box}.error{color:#ff9eaa;min-height:20px;font-size:13px;margin-top:10px}.brand-mark{display:inline-grid;place-items:center;width:48px;height:48px;border:1px solid #444;border-radius:50%;font-weight:900;margin-bottom:20px}.back{display:inline-block;margin-top:20px;color:#aaa}</style></head><body><main class="login"><span class="brand-mark">DIV</span><p class="eyebrow">PRIVATE MANAGEMENT AREA</p><h1>Admin Login</h1><p class="muted">Sign in to manage DIV apps, APK releases and website entries.</p><form id="loginForm"><div class="field"><label>USERNAME</label><input id="username" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit" style="width:100%">Sign in</button><div id="error" class="error"></div></form><a class="back" href="index.html">← Back to public site</a></main><script>const ADMIN_HASH='f69701b00a0bc4d57e1a0f45d6902165b79e17eb4edc185273ae3b087d3df9bc';async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value;const error=document.getElementById('error');if(u!=='admin'||await hash(p)!==ADMIN_HASH){error.textContent='Invalid username or password.';return}sessionStorage.setItem('div_admin_auth','1');location.href='admin.html'};</script></body></html>
